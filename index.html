<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corgi Coin</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">a very serious mint</p>
        <h1>Corgi Coin</h1>
      </div>
      <div class="stats">
        <p class="doge"><span id="doge">0</span> <span class="unit">doge</span></p>
        <p class="sub"><span id="cps">0</span>/sec · <span id="cpc">1</span>/click · <span id="owned-total">0</span> squishmollows</p>
      </div>
      <div class="tools">
        <button type="button" id="mute" aria-pressed="false">Sound on</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </header>

    <div class="layout">
      <section class="stage" id="stage">
        <div class="felt">
          <div class="coin-wrap" id="coin-wrap">
            <button type="button" id="coin" class="coin-btn" aria-label="Click the corgi coin">
              <img src="assets/coin.png" alt="Gold coin engraved with a corgi" width="1024" height="1024" draggable="false">
            </button>
            <div class="glint" aria-hidden="true"></div>
          </div>
          <p id="hint" class="hint">Click the corgi</p>
          <div id="floaters" class="floaters" aria-hidden="true"></div>
        </div>
        <div class="crew-block">
          <p class="crew-label">Squishmollows on duty</p>
          <p id="crew-empty" class="crew-empty">Hire one and they will tap the coin for you.</p>
          <div id="crew" class="crew"></div>
        </div>
      </section>

      <aside class="shop" aria-label="Squishmollow shop">
        <div class="shop-head">
          <div>
            <h2>Squishmollows</h2>
            <p id="shop-note">Each one taps the coin. A few also make your own clicks heavier.</p>
          </div>
          <div class="qty-row" role="group" aria-label="How many to buy or sell">
            <button type="button" class="qty on" data-qty="1" aria-pressed="true">1</button>
            <button type="button" class="qty" data-qty="10" aria-pressed="false">10</button>
            <button type="button" class="qty" data-qty="max" aria-pressed="false">Max</button>
            <button type="button" id="sell-mode" class="sell-toggle" aria-pressed="false">Sell</button>
          </div>
        </div>
        <div id="shop-list" class="shop-list"></div>
      </aside>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="js/economy.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
